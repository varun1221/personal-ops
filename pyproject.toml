[project]
name = "personal-ops-agent"
version = "0.1.0"
description = "A personal ops agent over Obsidian and Gmail, built on MCP + LangGraph"
requires-python = ">=3.12"

dependencies = [
    # MCP
    "mcp>=1.2.0",
    "langchain-mcp-adapters>=0.1.0",

    # Agent framework
    "langgraph>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",

    # Model providers (swappable via MODEL_PROVIDER)
    "langchain-anthropic>=0.3.0",
    "langchain-mistralai>=0.2.0",

    # Obsidian vault parsing
    "python-frontmatter>=1.1.0",
    "python-dateutil>=2.9.0",

    # Gmail
    "google-api-python-client>=2.150.0",
    "google-auth-oauthlib>=1.2.0",

    # CLI
    "rich>=13.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    # Pinned to a minor version on purpose: ruff's *default* rule set grows
    # between releases, so an unpinned ruff can fail CI on code nobody touched.
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "vaultlib", "history"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Ruff's defaults, minus two families that argue with decisions this project
# made deliberately:
#
#   DTZ  A day planner is local time by definition. Resolving "today" in UTC
#        would roll the date over at the wrong moment for the person reading it.
#   BLE  Parsing a vault must not crash on one malformed note, and the eval
#        harness must survive a scenario blowing up mid-run. Both catch broadly
#        on purpose, and both return a value rather than swallowing silently.
ignore = ["DTZ", "BLE"]

[tool.ruff.lint.per-file-ignores]
# This harness has to extend sys.path and load .env before it can import the
# project at all, so its imports genuinely cannot live in one sorted block.
"evals/live_eval.py" = ["I001"]
